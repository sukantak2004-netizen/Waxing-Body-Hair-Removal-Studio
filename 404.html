<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, height=device-height, viewport-fit=cover">
    <title>404 &middot; Page Not Found | BareGlow Waxing Studio</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23BE185D' stroke-width='1.5' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M12 2C8 6 4 9 4 14a8 8 0 0 0 16 0c0-5-4-8-8-12z'/%3E%3Cpath d='M12 22V12'/%3E%3C/svg%3E">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Jost:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        serif: ['"Cormorant Garamond"', 'serif'],
                        sans: ['"Jost"', 'sans-serif'],
                    },
                    colors: {
                        'wax-rose': '#BE185D',
                        'wax-rose-light': '#FCE7F3',
                        'wax-rose-dark': '#831843',
                        'wax-blush': '#FDF2F8',
                        'wax-cream': '#FEF9F3',
                        'wax-cream-dark': '#F5EDE4',
                        'wax-gold': '#C9A227',
                        'wax-gold-light': '#F5E6B8',
                        'wax-charcoal': '#2D1B2E',
                        'wax-gray': '#8A7A85',
                        'wax-sage': '#A8B5A0',
                        'dark-gray': '#1A0F1C',
                    }
                }
            }
        }
    </script>
    <style>
        .floating { animation: float 6s ease-in-out infinite; }
        @keyframes float { 0%, 100% { transform: translateY(0px) rotate(0deg); } 50% { transform: translateY(-20px) rotate(2deg); } }
        
        .pulse-glow {
            animation: pulseGlow 3s ease-in-out infinite;
        }
        @keyframes pulseGlow {
            0%, 100% { filter: drop-shadow(0 0 20px rgba(190, 24, 93, 0.2)); }
            50% { filter: drop-shadow(0 0 40px rgba(190, 24, 93, 0.5)) drop-shadow(0 0 80px rgba(190, 24, 93, 0.2)); }
        }

        .petal-float {
            animation: petalFloat 8s ease-in-out infinite;
        }
        @keyframes petalFloat {
            0%, 100% { transform: translateY(0) rotate(-5deg); }
            50% { transform: translateY(-25px) rotate(5deg); }
        }

        .petal-float-2 {
            animation: petalFloat2 10s ease-in-out infinite;
        }
        @keyframes petalFloat2 {
            0%, 100% { transform: translateY(0) rotate(5deg); }
            50% { transform: translateY(-15px) rotate(-5deg); }
        }

        .star-twinkle {
            animation: twinkle 2s ease-in-out infinite;
        }
        .star-twinkle:nth-child(2) { animation-delay: 0.7s; }
        .star-twinkle:nth-child(3) { animation-delay: 1.4s; }
        .star-twinkle:nth-child(4) { animation-delay: 0.3s; }
        .star-twinkle:nth-child(5) { animation-delay: 1.8s; }
        @keyframes twinkle {
            0%, 100% { opacity: 0.2; transform: scale(0.8); }
            50% { opacity: 1; transform: scale(1.2); }
        }

        .fade-in-up {
            animation: fadeInUp 1s ease-out forwards;
        }
        @keyframes fadeInUp {
            0% { opacity: 0; transform: translateY(30px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        body {
            font-family: 'Jost', sans-serif;
            overflow: hidden;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .error-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: 40px;
            padding: 2.5rem 2rem;
            box-shadow: 0 25px 60px rgba(190, 24, 93, 0.15);
            border: 1px solid rgba(190, 24, 93, 0.2);
            width: 100%;
            max-width: 560px;
            margin: 0 auto;
            position: relative;
            z-index: 2;
        }
        .dark .error-card {
            background: rgba(45, 27, 46, 0.92);
            border-color: rgba(190, 24, 93, 0.25);
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.5);
        }

        .error-number {
            font-family: 'Cormorant Garamond', serif;
            font-size: clamp(80px, 18vh, 140px);
            font-weight: 900;
            background: linear-gradient(135deg, #BE185D 0%, #831843 50%, #C9A227 100%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            line-height: 1;
            letter-spacing: -4px;
        }
        .dark .error-number {
            background: linear-gradient(135deg, #FCE7F3 0%, #BE185D 50%, #C9A227 100%);
            -webkit-background-clip: text;
            background-clip: text;
        }

        .btn-primary {
            background: #BE185D;
            color: #FFFFFF;
            padding: 0.8rem 2rem;
            border-radius: 60px;
            font-weight: 500;
            transition: all 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            justify-content: center;
            border: none;
            cursor: pointer;
            text-decoration: none;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            font-size: 0.72rem;
            box-shadow: 0 8px 20px -6px rgba(190, 24, 93, 0.4);
        }
        .btn-primary:hover {
            background: #831843;
            transform: translateY(-2px);
            box-shadow: 0 15px 30px -6px rgba(190, 24, 93, 0.5);
            color: #FFFFFF;
        }

        .btn-outline {
            border: 2px solid #BE185D;
            background: transparent;
            color: #BE185D;
            padding: 0.75rem 2rem;
            border-radius: 60px;
            font-weight: 500;
            transition: all 0.3s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            text-decoration: none;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            font-size: 0.72rem;
        }
        .btn-outline:hover {
            background: #BE185D;
            color: #FFFFFF;
            transform: translateY(-3px);
            box-shadow: 0 12px 30px rgba(190, 24, 93, 0.2);
        }

        .quick-link {
            color: #BE185D;
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 500;
            transition: color 0.2s;
            padding: 4px 0;
        }
        .quick-link:hover {
            color: #831843;
            text-decoration: underline;
        }
        .dark .quick-link:hover {
            color: #FCE7F3;
        }

        @media (max-width: 480px) {
            .error-card {
                padding: 1.5rem 1.2rem;
                border-radius: 28px;
                margin: 0 12px;
            }
            .error-number { font-size: 70px; }
            .btn-primary, .btn-outline {
                padding: 0.6rem 1.2rem;
                font-size: 0.8rem;
                width: 100%;
                justify-content: center;
            }
            .btn-group { flex-direction: column; width: 100%; }
            .btn-group a { width: 100%; }
            .quick-links { flex-wrap: wrap; justify-content: center; gap: 6px 12px; }
            .quick-link { font-size: 0.75rem; }
        }

        @media (max-width: 360px) {
            .error-card { padding: 1.2rem 0.8rem; border-radius: 24px; }
            .error-number { font-size: 55px; }
            .error-title { font-size: 1.2rem !important; }
            .error-text { font-size: 0.8rem !important; }
        }

        @media (max-height: 700px) {
            .error-card { padding: 1.2rem 1.5rem; }
            .error-number { font-size: 65px; }
            .error-title { font-size: 1.3rem !important; }
            .error-text { font-size: 0.85rem !important; }
        }

        @media (max-height: 600px) {
            .error-card { padding: 0.8rem 1.2rem; }
            .error-number { font-size: 50px; }
            .error-title { font-size: 1.1rem !important; }
            .error-text { font-size: 0.75rem !important; }
            .btn-primary, .btn-outline { padding: 0.4rem 1rem; font-size: 0.7rem; }
        }

        .floating-petal-1 {
            position: fixed;
            top: 8%;
            left: 5%;
            font-size: 60px;
            opacity: 0.08;
            pointer-events: none;
            z-index: 0;
            color: #BE185D;
        }
        .floating-petal-2 {
            position: fixed;
            bottom: 10%;
            right: 5%;
            font-size: 80px;
            opacity: 0.06;
            pointer-events: none;
            z-index: 0;
            color: #BE185D;
        }
        .floating-petal-3 {
            position: fixed;
            top: 50%;
            right: 8%;
            font-size: 40px;
            opacity: 0.05;
            pointer-events: none;
            z-index: 0;
            color: #BE185D;
        }
        .dark .floating-petal-1 { opacity: 0.1; color: #FCE7F3; }
        .dark .floating-petal-2 { opacity: 0.08; color: #FCE7F3; }
        .dark .floating-petal-3 { opacity: 0.06; color: #FCE7F3; }
    
    /* Date picker icon in dark mode */
    .dark input[type="date"]::-webkit-calendar-picker-indicator,
    .dark input[type="time"]::-webkit-calendar-picker-indicator {
      filter: invert(1);
    }
  </style>
</head>
<body class="bg-wax-cream dark:bg-dark-gray transition-colors duration-300">

    <!-- ===== BACKGROUND DECORATIONS ===== -->
    <div class="floating-petal-1 petal-float"><i class="fas fa-spa"></i></div>
    <div class="floating-petal-2 petal-float-2"><i class="fas fa-spa"></i></div>
    <div class="floating-petal-3 petal-float"><i class="fas fa-spa"></i></div>

    <!-- Twinkling Stars -->
    <div class="star-twinkle absolute top-[8%] left-[12%] text-wax-rose/20 text-2xl"><i class="fas fa-star"></i></div>
    <div class="star-twinkle absolute top-[15%] right-[15%] text-wax-rose/20 text-xl"><i class="fas fa-star"></i></div>
    <div class="star-twinkle absolute top-[70%] left-[20%] text-wax-rose/20 text-3xl"><i class="fas fa-star"></i></div>
    <div class="star-twinkle absolute bottom-[15%] right-[20%] text-wax-rose/20 text-2xl"><i class="fas fa-star"></i></div>
    <div class="star-twinkle absolute top-[45%] right-[5%] text-wax-rose/20 text-xl"><i class="fas fa-star"></i></div>

    <!-- ===== MAIN CONTENT ===== -->
    <div class="relative z-10 w-full max-w-[560px] px-4">
        <div class="error-card fade-in-up">

            <!-- Logo -->
            <div class="flex justify-center mb-6">
                <a href="index.html" class="flex items-center gap-3 group">
                    <div class="w-12 h-12 rounded-full bg-gradient-to-br from-wax-rose to-wax-rose-dark flex items-center justify-center shadow-lg group-hover:scale-110 transition-transform duration-500">
                        <i class="fas fa-spa text-white text-lg"></i>
                    </div>
                    <div class="flex flex-col text-left leading-none">
                        <span class="text-2xl font-serif font-bold text-wax-charcoal dark:text-wax-cream tracking-wide">
                            Bare<span class="text-wax-rose italic">Glow</span>
                        </span>
                        <span class="text-[8px] tracking-[0.35em] uppercase text-wax-rose font-semibold mt-1">WAXING STUDIO</span>
                    </div>
                </a>
            </div>

            <!-- Spa Icon -->
            <div class="text-6xl md:text-7xl text-wax-rose/50 mb-4 floating text-center">
                <i class="fas fa-spa"></i>
            </div>

            <!-- 404 Number -->
            <div class="error-number pulse-glow text-center">404</div>

            <!-- Error Title -->
            <h1 class="error-title font-serif text-2xl md:text-3xl font-bold text-wax-charcoal dark:text-wax-cream mb-3 text-center">
                Oops! Page <span class="italic text-wax-rose">Not Found</span>
            </h1>

            <!-- Error Message -->
            <p class="error-text text-wax-gray dark:text-wax-rose-light/70 text-sm md:text-base max-w-md mx-auto leading-relaxed text-center">
                The page you're looking for has wandered off — like a hair that decided to grow back. Don't worry, our studio is right where you left it.
            </p>

            <!-- Action Buttons -->
            <div class="btn-group flex flex-wrap gap-4 justify-center mt-8">
                <a href="index.html" class="btn-primary">
                    <i class="fas fa-home"></i> Back to Home
                </a>
                <a href="contact.html" class="btn-outline">
                    <i class="fas fa-calendar-check"></i> Book Now
                </a>
            </div>

            <!-- Quick Links -->
            <div class="quick-links flex flex-wrap justify-center gap-x-4 gap-y-2 mt-6 pt-6 border-t border-wax-rose-light/60 dark:border-wax-rose-dark/30">
                <a href="about.html" class="quick-link">About</a>
                <span class="text-wax-rose-light dark:text-wax-rose-dark/50">|</span>
                <a href="services.html" class="quick-link">Services</a>
                <span class="text-wax-rose-light dark:text-wax-rose-dark/50">|</span>
                <a href="pricing.html" class="quick-link">Pricing</a>
                <span class="text-wax-rose-light dark:text-wax-rose-dark/50">|</span>
                <a href="gallery.html" class="quick-link">Gallery</a>
                <span class="text-wax-rose-light dark:text-wax-rose-dark/50">|</span>
            </div>

            <!-- Search Hint -->
            <div class="mt-5 text-center">
                <p class="text-xs text-wax-gray dark:text-wax-rose-light/60">
                    <i class="fas fa-search text-wax-rose mr-1"></i> 
                    Need help finding something? 
                    <a href="contact.html" class="text-wax-rose font-semibold hover:underline">Contact our team</a>
                </p>
            </div>

        </div>
    </div>

    <!-- ===== SCRIPTS ===== -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Check for saved theme preference
            const savedTheme = localStorage.getItem('theme');
            if (savedTheme === 'dark') {
                document.documentElement.classList.add('dark');
            } else if (savedTheme === 'light') {
                document.documentElement.classList.remove('dark');
            } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
                document.documentElement.classList.add('dark');
            }

            // Check for saved RTL preference
            const savedDir = localStorage.getItem('dir');
            if (savedDir === 'rtl') {
                document.documentElement.dir = 'rtl';
            }

            // Keyboard shortcuts
            document.addEventListener('keydown', (e) => {
                if (e.key === 'h' || e.key === 'H') {
                    window.location.href = 'index.html';
                }
                if (e.key === 'b' || e.key === 'B') {
                    window.location.href = 'contact.html';
                }
                if (e.key === 'a' || e.key === 'A') {
                    window.location.href = 'about.html';
                }
                if (e.key === 's' || e.key === 'S') {
                    window.location.href = 'services.html';
                }
                if (e.key === 'p' || e.key === 'P') {
                    window.location.href = 'pricing.html';
                }
            });

            // Console easter egg
            console.log('%c✨ BareGlow Waxing Studio', 'font-size:24px; font-weight:bold; color:#BE185D;');
            console.log('%c404 · Page Not Found', 'font-size:16px; color:#831843;');
            console.log('%cLooks like you took a wrong turn! Let us guide you back to silky smooth skin.', 'font-size:12px; color:#8A7A85;');
        });
    </script>
</body>
</html>
